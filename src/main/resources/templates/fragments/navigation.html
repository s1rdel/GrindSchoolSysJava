<!-- Shared navigation fragment. Each page that includes it defines its own title. -->
<header xmlns:th="http://www.thymeleaf.org" class="site-header" th:fragment="navigation(activePage)">
    <div class="container header-inner">
        <a class="brand" th:href="@{/subjects}">GrindSchoolSYS</a>
        <nav class="site-nav" aria-label="Main navigation">
            <a th:href="@{/subjects}"
               th:attr="aria-current=${activePage == 'subjects' ? 'page' : null}">Subjects</a>
            <a th:href="@{/notifications}"
               th:attr="aria-current=${activePage == 'notifications' ? 'page' : null}">Notifications</a>
        </nav>
    </div>
</header>
