<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sessions | GrindSchoolSYS</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/navigation :: navigation('subjects')}"></header>

<main class="container page">
    <a class="back-link" th:href="@{/subjects}">← All subjects</a>

    <div class="page-heading">
        <h1 th:text="${subject.name + ' sessions'}">Subject sessions</h1>
        <a class="button" th:href="@{/subjects/{id}/sessions/new(id=${subject.id})}">Create session</a>
    </div>

    <p class="notice" th:if="${bookingMessage}" th:text="${bookingMessage}" role="status"></p>
    <p class="panel" th:if="${#lists.isEmpty(sessions)}">No upcoming sessions found.</p>

    <div class="panel table-wrap" th:unless="${#lists.isEmpty(sessions)}"
         tabindex="0" role="region" aria-label="Upcoming sessions">
        <table>
            <thead>
            <tr>
                <th scope="col">Tutor</th>
                <th scope="col">Date</th>
                <th scope="col">Time</th>
                <th scope="col">Total places</th>
                <th scope="col">Booking</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="lesson : ${sessions}">
                <td th:text="${lesson.tutor.name}"></td>
                <td th:text="${lesson.date}"></td>
                <td th:text="${lesson.time}"></td>
                <td th:text="${lesson.totalCapacity}"></td>
                <td>
                    <form method="post"
                          th:unless="${bookedSessionIds.contains(lesson.id)}"
                          th:action="@{/subjects/{subjectId}/sessions/{sessionId}/book(subjectId=${subject.id}, sessionId=${lesson.id})}">
                        <button class="button" type="submit">Book</button>
                    </form>

                    <form method="post"
                          th:if="${bookedSessionIds.contains(lesson.id)}"
                          th:action="@{/subjects/{subjectId}/sessions/{sessionId}/cancel(subjectId=${subject.id}, sessionId=${lesson.id})}">
                        <button class="button button--cancel" type="submit">Cancel</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
