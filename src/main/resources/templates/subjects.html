<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subjects | GrindSchoolSYS</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/navigation :: navigation('subjects')}"></header>

<main class="container page">
    <div class="page-heading">
        <div>
            <h1>Subjects</h1>
            <p class="subtitle">Choose a subject to see upcoming tutoring sessions.</p>
        </div>
    </div>

    <p class="panel" th:if="${#lists.isEmpty(subjects)}">No subjects found.</p>

    <ul class="subject-list" th:unless="${#lists.isEmpty(subjects)}">
        <li th:each="subject : ${subjects}">
            <a class="subject-card" th:href="@{/subjects/{id}/sessions(id=${subject.id})}">
                <span th:text="${subject.name}">Mathematics</span>
                <span aria-hidden="true">→</span>
            </a>
        </li>
    </ul>
</main>
</body>
</html>
