<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GrindSchoolSYS | Subjects</title>
</head>
<body>
<h1>Subjects</h1>

<p th:if="${#lists.isEmpty(subjects)}">No subjects found.</p>

<ul>
    <li th:each="subject : ${subjects}">
        <a th:href="@{/subjects/{id}/sessions(id=${subject.id})}"
           th:text="${subject.name}"></a>
    </li>
</ul>
</body>
</html>
